name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, xmlwriter
          coverage: none
          tools: composer:2.10.3

      - name: Install Symfony bundle dependencies
        run: composer install --working-dir=packages/static-site-bundle --prefer-dist --no-interaction

      - name: Turbo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Execute Pipeline (Check, Test, Build)
        run: bun x turbo run check test build
